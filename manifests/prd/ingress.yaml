# Fluxo: Browser -> DuckDNS (devfestinfoeste.duckdns.org) -> IP público da VM OCI
# -> Traefik (Ingress Controller nativo do k3s, ouvindo nas portas 80/443 do nó)
# -> Service infoeste26-site -> Pods
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infoeste26-site
  namespace: infoeste26
spec:
  ingressClassName: traefik
  rules:
    - host: devfestinfoeste.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infoeste26-site
                port:
                  number: 80
