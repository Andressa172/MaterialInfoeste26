# Workload: Deployment -> gerencia um ReplicaSet -> gerencia os Pods.
# Trocar a tag da imagem aqui (e dar git push) é o gatilho do GitOps: o ArgoCD
# detecta a mudança neste arquivo e aplica no cluster automaticamente.
#
# A imagem é buildada e importada direto no containerd do nó (scripts/vm-release.sh),
# sem depender de nenhum registry externo (Docker Hub, GHCR etc). Por isso
# imagePullPolicy é "Never": o k3s nunca tenta puxar de fora, só usa o que já
# foi importado localmente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infoeste26-site
  namespace: infoeste26
  labels:
    app: infoeste26-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infoeste26-site
  template:
    metadata:
      labels:
        app: infoeste26-site
    spec:
      containers:
        - name: site
          image: infoeste26-site:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          # timeouts generosos: a VM da demo é pequena e pode ficar momentaneamente
          # lenta sob carga (build de imagem, escalonamento) -- sem isso o kubelet
          # mata pods saudáveis por falso positivo de probe.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
