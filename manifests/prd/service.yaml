# Service tipo NodePort: expõe a aplicação direto na porta 80 do nó, sem
# precisar de um Ingress Controller (a VM da demo é pequena demais pro
# Traefik rodar de forma estável - ver docs/colinha-apresentacao.md).
# O range de NodePort do cluster foi ampliado pra incluir a porta 80
# (normalmente o padrão é 30000-32767).
apiVersion: v1
kind: Service
metadata:
  name: infoeste26-site
  namespace: infoeste26
spec:
  type: NodePort
  selector:
    app: infoeste26-site
  ports:
    - port: 80
      targetPort: 80
      nodePort: 80
